spring:
  datasource:
    url: ${PEEK_DB_URL:jdbc:postgresql://localhost:5432/peek}
    username: ${PEEK_DB_USER:peek}
    password: ${PEEK_DB_PASSWORD:peek_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
peek:
  llm:
    enabled: ${PEEK_LLM_ENABLED:false}
    synthetic-demo: ${PEEK_LLM_SYNTHETIC_DEMO:false}
    endpoint: ${PEEK_LLM_ENDPOINT:}
    model: ${PEEK_LLM_MODEL:}
    api-key: ${PEEK_LLM_API_KEY:}
    timeout: ${PEEK_LLM_TIMEOUT:3s}
    connect-timeout: ${PEEK_LLM_CONNECT_TIMEOUT:1s}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
